schema_version: 1

context:
  name: jsonpatch
  version: "1.47"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/jsonpatch-${{ version }}.tar.gz
  sha256: 5ed650b7517789e0f43428aa7b09442c0b90de0a0fd17a53fd0ebf55205c601e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - jsondiff = jsonpatch_cli:jsondiff_main
      - jsonpatch = jsonpatch_cli:jsonpatch_main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jsonpointer >=3.8

tests:
  - python:
      imports:
        - jsonpatch
      pip_check: true
      python_version:
        - ${{ python_min }}
        - 3.*
  - script:
      - jsondiff --help
      - jsonpatch --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Apply JSON-Patches (RFC 6902)
  homepage: https://github.com/stefankoegl/python-json-patch
  repository: https://github.com/stefankoegl/python-json-patch
  documentation: https://python-json-patch.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pavelzw
    - anguslees
    - pmlandwehr
    - beenje
